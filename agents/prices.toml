# API prices, US dollars per million tokens, used by `scaffold usage` to say what usage would have cost at
# API rates. On a subscription (Claude Max, ChatGPT) that is a measure of scale, not a bill.
# Source: Anthropic's published first-party rates, as cached on the date below. Check the pricing page and
# update this file when they change; a model missing here is reported in tokens only.
as_of = "2026-09-25"

[cache]                  # cache writes, as multiples of the input price
write_5m = 1.25
write_1h = 2.0

[[model]]
id = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25

[[model]]
id = "claude-opus-5-5"
input = 4.0
output = 20.0
cache_read = 0.20

[[model]]
id = "claude-sonnet-5-5"
input = 2.0
output = 10.0
cache_read = 0.20

[[model]]
id = "claude-sonnet-5"
input = 2.0
output = 10.0
cache_read = 0.20

[[model]]
id = "claude-haiku-4-5"
input = 1.0
output = 5.0
cache_read = 0.10
