# A profile names the repos a study depends on but never contains. Copy this file, fill it in,
# and pass `--profile <name>` to `scaffold new`. See PROTOCOL.md § 1.
name = "example"
org = "your-github-org"
author = "Your Name"
orcid = ""                                   # optional, for CITATION.cff

[corpus]                                     # the one shared record of claims and findings
repo = "your-github-org/research"
projects_dir = "projects"                    # a study's findings go in <repo>/<projects_dir>/<project>/

[prereg]                                     # the preregistration kit, installed with `kit_ap init`
repo = "polarizetech/adaptive-preregistration"
modules = ["experiment-pr-log"]              # added after init's defaults (core, prereg, convo-log)
tool_modules = ["tool-versioning"]           # for a tool repo instead: versions and releases (prereg, a default, scopes it)

[design]                                     # the design system every page uses; leave repo and package empty for none
name = ""                                    # what to call it; defaults to the repo's name
package = ""                                 # its package name, for build-based apps (npm, or a git dependency)
repo = ""                                    # its git source, owner/name on GitHub
ref = ""                                     # the release tag it is pinned to, never a branch
rules = ""                                   # its own instructions, at that tag; they are the source of truth
css = "design.css"                           # the stylesheet a zero-build page links
js = ""                                      # its script, if it has one
body_class = ""                              # the class a zero-build page puts on <body>, if it needs one
house_rules = []                             # short reminders for assistants, each naming the file that holds the rule

[workbench]                                  # shared tools not yet released; leave repo empty for none
repo = ""
marker = ""                                  # a file that only exists in a real checkout of it
env_aliases = []                             # older env var names, still honoured

[retrieval]                                  # the literature and evidence search every session uses first; leave server empty for none
repo = ""                                    # where it lives, for the link in AGENTS.md
server = ""                                  # the MCP server's name as sessions see it

[serving]                                    # where apps are viewed beyond localhost
tailnet_url = ""                              # e.g. https://<host>.<tailnet>.ts.net; leave empty for none; TAILNET_URL overrides it at run time

[licence]
code = "MIT"
docs = "CC-BY-4.0"

[agents]                                     # the specialist agents every repo gets (.claude/agents/)
disciplines = []                             # briefs from agents/disciplines/, by file name
conventions = []                             # house rules for code, one per line; empty means follow each repo's own config

[agents.routing]                             # override an agent's starting model: analyst = "opus:high"

[agents.codex]                               # models Codex should use; empty means its configured default
default_model = ""
escalation_model = ""
