# The polarizetech profile: how studies and sims in github.com/polarizetech are wired.
name = "polarizetech"
org = "polarizetech"
author = "Joshua Anderton"
orcid = "https://orcid.org/0009-0004-0741-6962"

[corpus]
repo = "polarizetech/research"
projects_dir = "projects"

[prereg]
repo = "polarizetech/adaptive-preregistration"
modules = ["experiment-pr-log"]
tool_modules = ["tool-versioning"]

[design]
name = "polarize-ui"
package = "@polarizetech/polarize-ui"
repo = "polarizetech/polarize-ui"
ref = "v0.6.7"
rules = "https://github.com/polarizetech/polarize-ui/blob/v0.6.7/README.md"
css = "design.css"
js = "design.js"
body_class = "ui"
# The Polarize UI design-system artifact (polarize-ui `claude-design-system/`): new pages are designed from it first.
artifact = "https://claude.ai/artifact/9gWHMLHB5exoNc67MGayjG"
# How a page shows that it is exploratory: a tier badge, not a paragraph.
exploratory_badge = '<ui-tier tier="EXPLORATORY"></ui-tier>'
# Reminders for assistants, each pointing at the file in polarize-ui (at `ref`) that holds the rule.
house_rules = [
  "A zero-build page links `design.css` and `design.js` and puts the `ui` class on `<body>`; a build-based app uses the shadcn bridge and the React components (`README.md` § Using it, `shadcn/SHADCN.md`). Never load `design.css` and the shadcn `theme.css` in the same document: both define `--accent`, and the loser is silent.",
  "`design.css` is generated from `tokens.json`: never edit `design.css`; change the token upstream, in `tokens.json`.",
  "The label rule (`CLAUDE.md` § The rule): a tier badge (MEASURED, PREDICTED, MODELLED, EXPLORATORY, SPEC, TASTE, REFUTED) is never hidden or shortened, and its explanation goes in `<ui-note>`. Measured values are upright (`.ui-measured`), predicted values italic (`.ui-predicted`). Every invented value carries ADDED or TASTE.",
  "Choose and judge a view of scientific data by `METHOD.md`: write the question it answers first, and label n, units, scope and thresholds on the figure itself.",
]

[workbench]
repo = "polarizetech/audio-projects"
marker = "tools/REGISTRY.md"
# An older variable name, still honoured.
env_aliases = ["AUDIO_PROJECTS"]

[retrieval]
repo = "polarizetech/retrieval-augmented-generation"
server = "research-rag"

[serving]                                    # where apps are viewed beyond localhost
tailnet_url = "https://joshuas-macbook-pro.tailc463ae.ts.net" # the MacBook's tailnet host (operator decision 2026-10-29); TAILNET_URL overrides it at run time

[licence]
code = "MIT"
docs = "CC-BY-4.0"

[agents]
disciplines = ["neuroscience", "cardiology", "auditory-electrophysiology", "bioelectricity"]
conventions = [
  "Python: typed throughout (every function annotated); new packages are checked with pyright in strict mode, and an existing repo keeps its mode until someone decides to raise it.",
  "Python lint and format: ruff, line length 100.",
  "TypeScript: strict mode. React UIs use shadcn/ui components from the design system.",
  "Minimal and readable: the smallest change that works, no speculative abstraction, code a reviewer can follow in one pass.",
]

[agents.routing]                             # starting model per agent; defaults in agents/README.md

[agents.codex]
default_model = "gpt-5.6-sol"
